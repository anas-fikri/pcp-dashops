<title>POD Performance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: kondisi saat ini (status + 5 angka) → alur status → warna umur & kinerja → aging → siapa yang ditindaklanjuti. Detail selalu di modal. */
:root {
  --bg: #f4f6f9; --card: #ffffff; --soft: #eef1f5; --hi: #eaf1ff;
  --ink: #0f172a; --muted: #475569; --line: #e2e8f0;
  --accent: #1e3a8a; --accent-strong: #172554; --on-accent: #ffffff; --accent-soft: #e0eaff;
  --success: #15803d; --success-soft: #dcfce7;
  --sev-hitam: #475569; --sev-oranye: #f59e0b; --sev-merah: #dc2626; --sev-ungu: #7c3aed;
  --sev-oranye-ink: #b45309; --on-sev: #ffffff; --on-oranye: #1f2937;
  --soft-hitam: #e2e8f0; --soft-oranye: #fef3c7; --soft-merah: #fee2e2; --soft-ungu: #ede9fe;
  --tip-bg: #0f172a; --tip-ink: #ffffff;
  --shadow: none;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-lg: 12px; --r-sm: 8px; --r-pill: 9999px;
  --ease: cubic-bezier(.2, .8, .2, 1); --dur-fast: 150ms; --dur: 250ms; --dur-slow: 650ms;
  --spot: rgba(37, 99, 235, .08); --lift: 0 12px 28px rgba(15, 23, 42, .10);
  /* palet DATA (bukan UI, bukan status, bukan umur) */
  --data-req: #0e7490; --data-ret: #2563eb; --data-pending: #94a3b8; --data-none: #cbd5e1;
  /* band header: energi tanpa menambah warna fungsi */
  --hero-a: #172554; --hero-b: #1e3a8a; --hero-c: #2563eb; --on-hero: #ffffff; --glow: transparent;
  /* pita kualitatif bullet graph (Few): gelap = buruk → terang = baik */
  --band-1: #cbd5e1; --band-2: #e2e8f0; --band-3: #f1f5f9;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --spot: rgba(143, 179, 227, .14); --lift: 0 12px 28px rgba(0, 0, 0, .45);
  --data-req: #2dd4bf; --data-ret: #60a5fa; --data-pending: #64748b; --data-none: #334155;
  --hero-a: #0b1430; --hero-b: #172554; --hero-c: #1e3a8a; --glow: transparent;
  --band-1: #3b4452; --band-2: #2c3440; --band-3: #222933;
  --bg: #0e1116; --card: #161a21; --soft: #1e232c; --hi: #1c2a40;
  --ink: #f2f4f7; --muted: #9aa4b2; --line: #262c36;
  --accent: #93c5fd; --accent-strong: #bfdbfe; --on-accent: #0f172a; --accent-soft: #1e2d4a;
  --success: #4ade80; --success-soft: #14351f;
  --sev-hitam: #cbd5e1; --sev-oranye: #fbbf24; --sev-merah: #f87171; --sev-ungu: #a78bfa;
  --sev-oranye-ink: #fbbf24; --on-sev: #0f172a; --on-oranye: #0f172a;
  --soft-hitam: #1e293b; --soft-oranye: #3a2a0a; --soft-merah: #3f1d1d; --soft-ungu: #2e1f4d;
  --tip-bg: #f1f0ee; --tip-ink: #17181b;
  --shadow: none;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --spot: rgba(143, 179, 227, .14); --lift: 0 12px 28px rgba(0, 0, 0, .45);
  --data-req: #2dd4bf; --data-ret: #60a5fa; --data-pending: #64748b; --data-none: #334155;
  --hero-a: #0b1430; --hero-b: #172554; --hero-c: #1e3a8a; --glow: transparent;
  --band-1: #3b4452; --band-2: #2c3440; --band-3: #222933;
  --bg: #0e1116; --card: #161a21; --soft: #1e232c; --hi: #1c2a40;
  --ink: #f2f4f7; --muted: #9aa4b2; --line: #262c36;
  --accent: #93c5fd; --accent-strong: #bfdbfe; --on-accent: #0f172a; --accent-soft: #1e2d4a;
  --success: #4ade80; --success-soft: #14351f;
  --sev-hitam: #cbd5e1; --sev-oranye: #fbbf24; --sev-merah: #f87171; --sev-ungu: #a78bfa;
  --sev-oranye-ink: #fbbf24; --on-sev: #0f172a; --on-oranye: #0f172a;
  --soft-hitam: #1e293b; --soft-oranye: #3a2a0a; --soft-merah: #3f1d1d; --soft-ungu: #2e1f4d;
  --tip-bg: #f1f0ee; --tip-ink: #17181b;
  --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg) radial-gradient(1200px 420px at 50% -120px, var(--glow), transparent 70%) no-repeat; color: var(--ink); font: 14px/1.5 var(--font); }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font-size: 18px; font-weight: 800; letter-spacing: -.01em; display: inline-flex; align-items: center; }
.card-head h2::before, .now h2::before { content: ""; width: 4px; height: 18px; border-radius: 4px; background: var(--accent); margin-right: 10px; flex: none; }
.muted { color: var(--muted); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 14px 20px; border-radius: var(--r-lg); color: var(--on-hero);
  background: linear-gradient(115deg, var(--hero-a), var(--hero-b) 45%, var(--hero-c) 70%, var(--hero-b)); background-size: 220% 100%; animation: sheen 14s ease-in-out infinite alternate;
  box-shadow: 0 10px 30px rgba(15, 29, 51, .25); }
@keyframes sheen { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
.top .seg { background: rgba(255, 255, 255, .10); border-color: rgba(255, 255, 255, .22); }
.top .seg button { color: rgba(255, 255, 255, .8); }
.top .seg button[aria-pressed="true"] { background: #fff; color: var(--hero-b); }
.top .btn { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .55); }
.top .btn:hover { background: rgba(255, 255, 255, .12); }
.top .btn.primary { background: #fff; color: var(--hero-b); border-color: #fff; }
.top .btn.primary:hover { background: #e0eaff; }
.top .psum { color: rgba(255, 255, 255, .85); }
.top h1 { font-size: 25px; font-weight: 800; letter-spacing: -.02em; }
.top .meta { color: rgba(255, 255, 255, .78); font-size: 13px; }
.top .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: var(--r-pill); padding: 3px 10px; font-size: 12px; font-weight: 600; letter-spacing: .02em; }
.pill.sim { background: var(--soft); color: var(--muted); border: 1px dashed var(--muted); }
.top .pill.sim { background: rgba(255, 255, 255, .12); color: #fff; border-color: rgba(255, 255, 255, .5); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--muted); background: var(--card); border-radius: var(--r-pill); padding: 8px 16px; font-weight: 600; font-size: 13px; cursor: pointer; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-strong); }
.btn.sm { padding: 5px 12px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-pill); padding: 3px; background: var(--card); }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: var(--r-pill); cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

/* hint (i) */
.info { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--muted); color: var(--muted);
  font-size: 10.5px; font-weight: 700; font-style: normal; margin-left: 6px; cursor: help; flex: none; text-transform: none; letter-spacing: 0; vertical-align: 1px; }
.info:hover, .info:focus-visible { background: var(--ink); color: var(--card); border-color: var(--ink); }
.info { position: relative; } .info::after { content: ""; position: absolute; inset: -8px; }
.desc { display: block; font-size: 12px; color: var(--muted); font-weight: 400; line-height: 1.35; white-space: normal; }

/* mention berwarna: teks yang menyebut warna ikut berlatar warna itu */
.mention { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px; border-radius: var(--r-pill); font-weight: 700; }
.m-ungu { background: var(--soft-ungu); color: var(--sev-ungu); } .m-merah { background: var(--soft-merah); color: var(--sev-merah); }
.m-oranye { background: var(--soft-oranye); color: var(--sev-oranye-ink); } .m-hitam { background: var(--soft-hitam); color: var(--ink); }
.m-ok { background: var(--success-soft); color: var(--success); }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.field { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; position: relative; }
.field .lbl { display: inline-flex; align-items: center; }
.filters select, .rangebtn { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--card); border: 1px solid var(--muted); border-radius: var(--r-sm); padding: 7px 10px; min-width: 140px; max-width: 100%; }
.rangebtn { cursor: pointer; text-align: left; display: inline-flex; gap: 10px; align-items: center; justify-content: space-between; min-width: 210px; }
.period { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filters .arrow { color: var(--muted); align-self: center; padding-top: 18px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); border-radius: var(--r-pill); padding: 4px 10px; font-size: 12.5px; cursor: pointer; }
.chip:hover { border-color: var(--muted); }
.chip.on { background: var(--hi); border-color: var(--accent); }
.chip .x { font-weight: 700; color: var(--muted); }

/* date range picker */
.dp { position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 40px rgba(0,0,0,.18);
  padding: 14px; width: max-content; max-width: calc(100vw - 32px); color: var(--ink); font-weight: 400; letter-spacing: 0; }
.dp-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.dp-head b { font-size: 13px; }
.dp-nav { border: 1px solid var(--line); background: var(--card); border-radius: 50%; width: 30px; height: 30px; cursor: pointer; }
.dp-months { display: flex; flex-wrap: wrap; gap: 18px; }
.dp-month h4 { margin: 0 0 6px; font-size: 13px; text-align: center; }
.dp-grid { display: grid; grid-template-columns: repeat(7, 34px); gap: 2px 0; }
.dp-grid .wd { font-size: 11px; color: var(--muted); text-align: center; padding: 2px 0; }
.dp-grid button { height: 32px; border: 0; background: none; cursor: pointer; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.dp-grid button:hover:not([disabled]) { background: var(--soft); border-radius: 8px; }
.dp-grid button.in { background: var(--accent-soft); border-radius: 0; }
.dp-grid button.a, .dp-grid button.b { background: var(--accent); color: var(--on-accent); border-radius: 8px; font-weight: 700; }
.dp-grid button.today { box-shadow: inset 0 0 0 1px var(--muted); border-radius: 8px; }
.dp-grid button[disabled] { color: var(--muted); opacity: .35; cursor: default; }
.dp-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12.5px; }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px 22px; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; margin-bottom: 2px; }
.card .sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 14px; max-width: 80ch; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }

/* kondisi saat ini */
.now { display: grid; gap: 14px; }
/* Banner: latar netral; garis kiri, ikon & judul = warna LEVEL status; setiap alasan = pil dengan warnanya sendiri */
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; border-radius: 14px;
  background: var(--soft); border: 1px solid var(--line); border-left: 5px solid var(--lvl); }
.status .ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; flex: none; background: var(--lvl); color: var(--lvl-on); }
.status .what { font-size: 16px; font-weight: 800; color: var(--lvl-ink); }
.status .reasons { font-size: 14px; display: inline-flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.status .reasons .go { text-decoration: none; display: inline-flex; }
.status .mention { text-align: left; }
.status .reasons .go:hover .mention { box-shadow: 0 0 0 1px currentColor; }
.lvl-crit { --lvl: var(--sev-merah); --lvl-ink: var(--sev-merah); --lvl-on: var(--on-sev); }
.lvl-warn { --lvl: var(--sev-oranye); --lvl-ink: var(--sev-oranye-ink); --lvl-on: var(--on-oranye); }
.lvl-good { --lvl: var(--success); --lvl-ink: var(--success); --lvl-on: var(--card); }
.focus { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13.5px; }
.focus .k { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi { position: relative; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 14px 16px 12px; cursor: pointer; display: grid; gap: 6px; align-content: start; }
.kpi:hover { border-color: var(--accent); }
.kpi .lbl { font-size: 13px; font-weight: 700; display: flex; align-items: center; }
.kpi .val { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.kpi .val b { font-size: 34px; font-weight: 800; letter-spacing: -.035em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.kpi .val span { font-size: 13px; font-weight: 700; padding: 1px 8px; border-radius: var(--r-pill); background: var(--soft); font-variant-numeric: tabular-nums; }
.kpi .say { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.kpi .kdot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 8px; flex: none; }
.kpi:focus-visible, .fcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.meter { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; display: flex; }
.meter > span { display: block; height: 100%; }

/* severity */
.sevbar { display: flex; height: 12px; border-radius: 4px; overflow: hidden; background: var(--soft); min-width: 90px; }
.sevbar.lg { height: 26px; border-radius: 6px; }
.sevbar > span { display: block; height: 100%; border-right: 2px solid var(--card); cursor: pointer; }
.sevbar > span:last-child { border-right: 0; }
.sevbar > span:hover { filter: brightness(1.15); }
.bg-hitam { background: var(--sev-hitam); } .bg-oranye { background: var(--sev-oranye); } .bg-merah { background: var(--sev-merah); } .bg-ungu { background: var(--sev-ungu); }
.t-ungu { color: var(--sev-ungu); } .t-merah { color: var(--sev-merah); } .t-oranye { color: var(--sev-oranye-ink); } .t-hitam { color: var(--ink); } .t-ok { color: var(--success); }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.legend { display: grid; gap: 2px; margin-top: 12px; }
.legend button { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 10px; align-items: center; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: var(--r-sm); cursor: pointer; }
.legend button:hover { background: var(--soft); }
.legend .n { font-weight: 700; font-variant-numeric: tabular-nums; }
.legend .p { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
.age { display: inline-block; min-width: 34px; text-align: center; border-radius: 6px; padding: 1px 7px; font-weight: 700; font-size: 12.5px; color: var(--on-sev); font-variant-numeric: tabular-nums; }
.age.bg-oranye { color: var(--on-oranye); }

/* links */
.go { color: inherit; font-weight: 700; text-decoration: none; text-underline-offset: 3px; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; font-weight: 700; border-radius: 4px; }
.go:hover, .go:focus-visible { text-decoration: underline; }
.go:hover { text-decoration-color: var(--accent); }
.name .go { color: var(--accent); }
.go.t-ungu, .go.t-merah, .go.t-oranye { text-decoration-color: currentColor; }

/* tables */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; vertical-align: middle; }
th { font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
th:first-child, td:first-child, .l { text-align: left; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover td, tr.flash td { background: var(--hi); }
tr.flash td { transition: background 1.2s; }
tr.d0 td:first-child b, tr.d1 td:first-child b, tr.d2 td:first-child b { font-weight: 800; }
tr.grp td { background: var(--soft); font-weight: 700; color: var(--muted); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; text-align: left; }
tr.tot td { font-weight: 800; }
td.z { color: var(--muted); opacity: .6; }
td.status-cell { white-space: normal; min-width: 220px; }
.pbar { display: inline-grid; grid-template-columns: 56px 52px; gap: 8px; align-items: center; }

/* aging: angka berwarna */
.hm td.c { cursor: pointer; padding: 6px 10px; border-radius: 6px; }
.hm td.c:hover { background: var(--soft); }
.hm td.c > span { display: grid; line-height: 1.2; }
.hm td.c b { font-size: 15px; font-weight: 800; }
.hm td.c small { font-size: 11px; color: var(--muted); }
.hm td.c.zero b { color: var(--muted); opacity: .5; font-weight: 600; }
.hm th.sevh { box-shadow: inset 0 -3px 0 var(--hc); }
.hm .legend-inline { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; }

/* rank */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.rank td.name { max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
.rank td.bar { width: 32%; min-width: 160px; }
.tag { display: inline-block; padding: 1px 8px; border-radius: var(--r-pill); background: var(--soft); color: var(--muted); font-size: 11px; font-weight: 600; margin-left: 6px; }

/* rules */
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 12px 24px; margin-top: 14px; }
.rules div { border-left: 3px solid var(--line); padding-left: 12px; }
.rules b { display: block; }
.rules span { color: var(--muted); font-size: 13px; }
details.card summary { cursor: pointer; font-weight: 700; font-size: 16px; }

/* modal */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(20,20,24,.5); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dialog { background: var(--card); color: var(--ink); border-radius: var(--r-lg); width: min(1180px, 100%); max-height: 100%; overflow: auto; padding: 20px 22px; display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.dlg-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 13px; color: var(--muted); }
.crumbs button { border: 0; background: none; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; font: inherit; }
.crumbs b { color: var(--ink); }
.dlg-title { font-size: 20px; font-weight: 800; letter-spacing: -.01em; margin-top: 2px; }
.x-btn { border: 1px solid var(--line); background: var(--card); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px; flex: none; }
.mstats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.money { font-size: 13px; color: var(--muted); } .money b { color: var(--ink); font-weight: 800; font-variant-numeric: tabular-nums; }

  .hero .split-legend button { flex-wrap: wrap; white-space: normal; } .donut-wrap { grid-template-columns: 1fr; justify-items: center; } }

/* ---------- v8: efek & interaksi ---------- */
@keyframes rise { from { transform: translateY(12px); } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes pop { from { transform: translateY(10px) scale(.98); } }
@keyframes fade { from { opacity: 0; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--lvl); } 70% { box-shadow: 0 0 0 12px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.card, .kpi, .fcard, .totals, .status { animation: rise var(--dur-slow) var(--ease) both; }
.kpis .kpi:nth-child(2), .focus-grid .fcard:nth-child(2) { animation-delay: 60ms; }
.kpis .kpi:nth-child(3), .focus-grid .fcard:nth-child(3) { animation-delay: 120ms; }
.kpis .kpi:nth-child(4) { animation-delay: 180ms; } .kpis .kpi:nth-child(5) { animation-delay: 240ms; }
.meter, .sevbar, .split-bar { transform-origin: left center; animation: grow var(--dur-slow) var(--ease) both; }
.kpi, .fcard { background-image: radial-gradient(240px circle at var(--mx, 50%) var(--my, -60%), var(--spot), transparent 70%);
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur); }
.kpi:hover, .fcard:hover { transform: translateY(-3px); box-shadow: var(--lift); }
.kpi:active, .fcard:active { transform: translateY(-1px); }
.lvl-crit .ic { animation: pulse 2s var(--ease) infinite; }
.seg button { transition: background var(--dur) var(--ease), color var(--dur); }
.chip, .btn, .legend button, .why button, .split-legend button { transition: background var(--dur-fast), border-color var(--dur-fast), transform var(--dur-fast); }
.btn:active, .chip:active { transform: scale(.97); }
.sevbar > span { transition: filter var(--dur-fast), transform var(--dur-fast); transform-origin: center; }
.sevbar > span:hover { transform: scaleY(1.35); filter: brightness(1.12); }
.hm td.c b { display: inline-block; transition: transform var(--dur-fast) var(--ease); }
.hm td.c:hover b { transform: scale(1.15); }
tbody tr td { transition: background var(--dur-fast); }
tr.linked td { background: var(--hi); }
tr.linked td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.modal { animation: fade var(--dur) ease both; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.dialog { animation: pop var(--dur) var(--ease) both; }
.tip, .toast { animation: fade var(--dur-fast) ease both; }
.trend-box { position: relative; height: 280px; }
.trend-box canvas { cursor: pointer; }
/* ---------- v11: tidak terlihat "AI", tidak kusam ---------- */

const SEEN = new Set();
function viewKey() { return JSON.stringify([S.pmode, S.pmode === 'preset' ? S.period : [S.from, S.to], S.cust, S.scope, S.reg, S.btype, S.lv, S.branch, S.basis]); }
function agoTxt(ms) { const m = Math.round(ms / 60000); return m < 60 ? t('min', { n: m }) : m < 1440 ? t('hr', { n: Math.round(m / 60) }) : t('day', { n: Math.round(m / 1440) }); }
function renderSince(c) {
  const key = viewKey(), now = Date.now(), cur = { belum: c.belum, overD: c.overD, ungu: c.ungu, vBelum: c.vBelum };
  let store = {};
  try { store = JSON.parse(localStorage.getItem('pod-last-visit') || '{}'); } catch (e) { store = {}; }
  const prev = store[key];
  if (!SEEN.has(key)) {
    SEEN.add(key);
    if (prev) store['__shown_' + key] = prev;
    store[key] = { t: now, ...cur };
    try { const keys = Object.keys(store).filter(k => !k.startsWith('__')); if (keys.length > 40) delete store[keys[0]]; localStorage.setItem('pod-last-visit', JSON.stringify(store)); } catch (e) { /* abaikan */ }
  }
  const base = store['__shown_' + key];
  const el = $('#since');
  if (!base) { el.innerHTML = `<span class="k">${t('since.k')}</span><span class="muted">${t('since.first')}</span>${info(t('since.tip'))}`; return; }
  const item = (lbl, sp, a, b, kind) => `<button type="button" data-open="${spec(sp)}">${esc(lbl)} ${deltaHtml(a, b, kind, false) || ''}</button>`;
  const same = cur.belum === base.belum && cur.overD === base.overD && cur.ungu === base.ungu;
  el.innerHTML = `<span class="k">${t('since.k')} · ${t('since.ago', { t: agoTxt(now - base.t) })}</span>` +
    (same ? `<span class="muted">${t('since.none')}</span>` :
      item(t('since.not'), { node: 'belum' }, cur.belum, base.belum, 'n') + item(t('since.past'), { node: 'dlv', over: true }, cur.overD, base.overD, 'n') +
      item(t('since.crit'), { node: 'belum', sev: 'ungu' }, cur.ungu, base.ungu, 'n') + item(t('since.hold'), { node: 'belum' }, cur.vBelum, base.vBelum, 'rp')) + info(t('since.tip'));
}

function weekly(rows) {
  const m = new Map();
  rows.forEach(r => {
    if (!r.req) return;
    const w = weekOf(r.pos);
    let o = m.get(w);
    if (!o) m.set(w, o = { w, n: 0, s: 0, b: 0, ot: 0, od: 0 });
    o.n++;
    if (r.grp === 'S') { o.s++; if (!r.over) o.ot++; } else { o.b++; if (r.grp === 'D' && r.over) o.od++; }
  });
  return [...m.values()].sort((a, b) => a.w - b.w).slice(-12);
}
function spark(vals, col, kind) {
  const pts = vals.map((v, i) => [i, v]).filter(x => x[1] != null && isFinite(x[1]));
  if (pts.length < 2) return '';
  const W = 120, H = 34, n = vals.length - 1, ys = pts.map(x => x[1]), max = Math.max(...ys), min = Math.min(...ys);
  const X = i => (i / n) * W, Y = v => H - 3 - ((v - min) / (max - min || 1)) * (H - 8);
  const line = pts.map((x, i) => `${i ? 'L' : 'M'}${X(x[0]).toFixed(1)},${Y(x[1]).toFixed(1)}`).join('');
  const area = `${line}L${X(pts[pts.length - 1][0]).toFixed(1)},${H}L${X(pts[0][0]).toFixed(1)},${H}Z`;
  const last = pts[pts.length - 1], f = v => (kind === 'p' ? fp(v) : fmt(v));
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(t('spark.tip', { n: vals.length, a: f(pts[0][1]), b: f(last[1]) }))}" data-tip="${esc(t('spark.tip', { n: vals.length, a: f(pts[0][1]), b: f(last[1]) }))}">
    <path class="area" d="${area}" fill="${col}"/><path class="ln" d="${line}" stroke="${col}" vector-effect="non-scaling-stroke"/>
    <circle class="end" cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="3.5" fill="${col}" vector-effect="non-scaling-stroke"/></svg>`;
}

const REDUCED = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
const prevCount = {};
function countUp(root = document) {
  root.querySelectorAll('[data-count]').forEach(el => {
    const to = parseFloat(el.dataset.count), key = el.dataset.key, kind = el.dataset.fmt;
    if (!isFinite(to)) return;
    const from = prevCount[key] ?? 0; prevCount[key] = to;
    if (REDUCED.matches || from === to) return;
    const f = v => (kind === 'p' ? fp(v) : kind === 'rp' ? rp(v) : fmt(Math.round(v)));
    const final = el.textContent, t0 = performance.now(), dur = 650;
    const step = now => {
      if (!el.isConnected) return;
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = k < 1 ? f(from + (to - from) * e) : final;
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

function renderSev() {
  const c = core(F), sc = sevCounts(c.belumRows);

  let acc = 0;

const DP = { a: null, b: null, y: 0, m: 0 };
function openDP() {
  DP.a = S.from; DP.b = S.to;
  const d = dDate(S.to); DP.y = d.getUTCFullYear(); DP.m = d.getUTCMonth() - (window.innerWidth >= 700 ? 1 : 0);
  if (DP.m < 0) { DP.m += 12; DP.y--; }
  $('#dp').hidden = false; renderDP();
}
const closeDP = () => { $('#dp').hidden = true; };
function renderDP() {
  const months = window.innerWidth >= 700 ? 2 : 1;
  const wdNames = [...Array(7)].map((_, i) => dDate(dayOf(2024, 0, 1) + i).toLocaleDateString(LOC(), { weekday: 'short', timeZone: 'UTC' }));
  let html = `<div class="dp-head"><button type="button" class="dp-nav" data-dpnav="-1" aria-label="${t('dp.prev')}">‹</button><b>${DP.b == null ? t('dp.end') : t('dp.start')}</b><button type="button" class="dp-nav" data-dpnav="1" aria-label="${t('dp.next')}">›</button></div><div class="dp-months">`;
  for (let k = 0; k < months; k++) {
    let y = DP.y, m = DP.m + k; if (m > 11) { m -= 12; y++; }
    const first = dayOf(y, m, 1), days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate(), lead = (dDate(first).getUTCDay() + 6) % 7;
    html += `<div class="dp-month"><h4>${dDate(first).toLocaleDateString(LOC(), { month: 'long', year: 'numeric', timeZone: 'UTC' })}</h4><div class="dp-grid">${wdNames.map(w => `<span class="wd">${esc(w)}</span>`).join('')}${'<span></span>'.repeat(lead)}`;
    for (let i = 0; i < days; i++) {
      const d = first + i, cls = [];
      if (DP.a != null && DP.b != null && d > DP.a && d < DP.b) cls.push('in');
      if (d === DP.a) cls.push('a'); if (d === DP.b) cls.push('b'); if (d === TODAY) cls.push('today');
      html += `<button type="button" data-dpday="${d}" class="${cls.join(' ')}" ${d > TODAY || d < BASE + 10 ? 'disabled' : ''}>${i + 1}</button>`;
    }
    html += '</div></div>';
  }
  const tm = dDate(TODAY), y = tm.getUTCFullYear(), m = tm.getUTCMonth();
  html += `</div><div class="dp-foot"><span class="chips"><button type="button" class="chip" data-dpq="${dayOf(y, m, 1)},${TODAY}">${t('dp.thisM')}</button><button type="button" class="chip" data-dpq="${dayOf(y, m - 1, 1)},${dayOf(y, m, 0)}">${t('dp.lastM')}</button></span>
    <span class="muted">${DP.a != null ? `${fd(DP.a)} – ${DP.b != null ? fd(DP.b) : '…'}` : ''}</span></div>`;
  $('#dp').innerHTML = html;
}
function pickDay(d) {
  if (DP.a == null || DP.b != null) { DP.a = d; DP.b = null; renderDP(); return; }
  if (d < DP.a) { DP.a = d; renderDP(); return; }
  DP.b = d; S.from = DP.a; S.to = DP.b; closeDP(); render();
}

async function saveWorkbook(wb, filename) {
  const data = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  if (!window.claude) { XLSX.writeFile(wb, filename); return; }
  const dl = await window.claude.use('downloads');
  if (!dl) { toast(t('t.na')); return; }
  try { await dl.save({ filename, data: new Uint8Array(data) }); toast(t('t.saved')); }
  catch (e) { toast(e && e.code === 'declined' ? t('t.cancel') : e && e.code === 'rate_limited' ? t('t.wait') : t('t.na')); }
}

    add([[t('now.title'), t('c.count'), t('c.val'), '%'],
      [t('tot.title'), c.all, c.vAll, 100], [nl('balik'), c.balik, c.vBalik, r1(pct(c.balik, c.all))], [nl('tidak'), no, c.vAll - c.vBalik, r1(pct(no, c.all))], [],
      [t('k2'), c.sudah, c.vSudah, r1(pct(c.sudah, c.balik))], [t('k3'), c.belum, c.vBelum, r1(pct(c.belum, c.balik))], [t('k4'), c.overD, c.vOverD, r1(pct(c.overD, c.dlv))],
      [t('k5'), c.ontime, c.vOntime, r1(pct(c.ontime, c.sudah))], [t('bl.crit'), c.ungu, c.vUngu, r1(pct(c.ungu, c.belum))], [t('p.avg'), Math.round(c.avgLead || 0)], [],
      [t('fo.title'), t('c.count'), t('c.val'), '%'],
      ...[['br', 'fo.br'], ['cust', 'fo.cu'], ['st', 'fo.st']].map(([k, lk]) => { const top = groupCount(c.belumRows, k)[0]; if (!top) return [t(lk)]; const rr = c.belumRows.filter(r => r[k] === top[0]); return [`${t(lk)}: ${nameOf(k, top[0])}`, rr.length, sumV(rr), r1(pct(rr.length, c.belum))]; })], 'Overview');
  } else if (key === 'trend') {
    const m = new Map();
    F.forEach(r => { if (!r.req) return; const w = weekOf(r.pos); let o = m.get(w); if (!o) m.set(w, o = { w, n: 0, s: 0, b: 0, ot: 0, vs: 0, vb: 0 }); o.n++; if (r.grp === 'S') { o.s++; o.vs += r.val; if (!r.over) o.ot++; } else { o.b++; o.vb += r.val; } });
    add([[t('sp.wk', { d: '' }).trim(), nl('balik'), t('tr.ret'), t('tr.ret') + ' (Rp)', t('tr.not'), t('tr.not') + ' (Rp)', t('tr.ret') + ' %', t('tr.ot') + ' %'],
      ...[...m.values()].sort((a, b) => a.w - b.w).map(x => [dDate(x.w), x.n, x.s, x.vs, x.b, x.vb, r1(pct(x.s, x.n)), x.s >= 10 ? r1(pct(x.ot, x.s)) : ''])], 'Trend');
  } else if (key === 'flow') {
    add([[t('c.status'), '', t('c.count'), t('c.val'), t('c.parent'), t('c.ofRet'), t('sc.INTRACITY'), t('sc.INTRACITY') + ' (Rp)', t('sc.DOMESTIK'), t('sc.DOMESTIK') + ' (Rp)'],
      ...NODES.map(n => { const rr = F.filter(n.t), pr = n.p ? F.filter(NODE[n.p].t).length : null, I = rr.filter(r => r.scope === 'INTRACITY'), D = rr.filter(r => r.scope !== 'INTRACITY');
        return ['  '.repeat(n.d) + L(n.label), L(n.short), ...nv2(rr), pr == null ? '' : r1(pct(rr.length, pr)), n.d >= 2 ? r1(pct(rr.length, c.balik)) : '', ...nv2(I), ...nv2(D)]; })], 'Status flow');
  } else if (key === 'sev') {
    add([[t('sev.title'), t('colourW', { x: '' }).trim(), t('c.count'), t('c.val'), '%'],
      ...SEV.map(x => { const rr = c.belumRows.filter(r => r.sev === x.k); return [`${L(x.label)} – ${L(x.short)}`, sevRanges(x), rr.length, sumV(rr), r1(pct(rr.length, c.belum))]; })], 'Age colour');
  } else if (key === 'scope') {
    const D = ['INTRACITY', 'DOMESTIK'].map(sc => core(F.filter(r => r.scope === sc)));
    const row = (lbl, f) => [lbl, ...D.flatMap(f)];
    add([[t('scp.title'), t('sc.INTRACITY') + ' (AWB)', t('sc.INTRACITY') + ' (Rp)', t('sc.DOMESTIK') + ' (AWB)', t('sc.DOMESTIK') + ' (Rp)'],
      row(t('scp.ship'), x => [x.all, x.vAll]), row(nl('balik'), x => [x.balik, x.vBalik]), row(nl('sudah'), x => [x.sudah, x.vSudah]), row(nl('belum'), x => [x.belum, x.vBelum]),
      row(t('k5'), x => [x.ontime, x.vOntime]), row(t('bl.crit'), x => [x.ungu, x.vUngu]), row(t('p.past'), x => [x.overD, x.vOverD]), [],
      [t('scp.title'), t('sc.INTRACITY'), '', t('sc.DOMESTIK')],
      [t('bl.ret') + ' %', r1(pct(D[0].sudah, D[0].balik)), '', r1(pct(D[1].sudah, D[1].balik))],
      [t('bl.ot') + ' %', r1(pct(D[0].ontime, D[0].sudah)), '', r1(pct(D[1].ontime, D[1].sudah))],
      [t('bl.crit') + ' %', r1(pct(D[0].ungu, D[0].belum)), '', r1(pct(D[1].ungu, D[1].belum))],
      [t('p.avg'), Math.round(D[0].avgLead || 0), '', Math.round(D[1].avgLead || 0)]], 'Intracity vs Domestic');
  } else if (key === 'perf') {
    const groups = [[6, r => r.sla === 6], [7, r => r.sla === 7], ['INTERNAL', r => r.btype === 'INTERNAL'], ['AGENT', r => r.btype === 'AGENT'], ['SITE', r => r.lv === 'SITE']];
    const lbl = g => (g === 6 || g === 7 ? t('g.sla', { n: g }) : g === 'SITE' ? t('lvs.SITE') : t((g === 'INTERNAL' || g === 'AGENT' ? 'ty.' : 'sc.') + g));
    add([[t('p.group'), t('p.ret'), t('p.ret') + ' (Rp)', t('p.avg'), t('p.ot') + ' %', t('p.past'), t('p.past') + ' (Rp)'],
      ...groups.map(([g, f]) => { const cc = core(F.filter(f)); return [lbl(g), cc.sudah, cc.vSudah, Math.round(cc.avgLead || 0), r1(pct(cc.ontime, cc.sudah)), cc.overD, cc.vOverD]; })], 'Return performance');
  } else if (key === 'aging') {
    const ids = ['ND', 'dlv', 'MDP', 'PODC', 'REDOC', 'UPLOAD', 'belum'];
    const head = [t('c.status'), ...BUCKETS.map(b => `${b.label} ${U()}`), t('total')];
    add([head, ...ids.map(id => { const rr = F.filter(NODE[id].t); return [nl(id), ...BUCKETS.map(b => rr.filter(r => r.bk === b.i).length), rr.length]; })], 'Aging (AWB)');
    add([head, ...ids.map(id => { const rr = F.filter(NODE[id].t); return [nl(id), ...BUCKETS.map(b => sumV(rr.filter(r => r.bk === b.i))), sumV(rr)]; })], 'Aging (Rp)');
  } else if (key === 'rank') {
    const k = 'br', tot = c.belum;
    const list = [...new Set(F.map(r => r[k]))].map(id => ({ id, cc: core(F.filter(r => r[k] === id)) })).filter(x => x.cc.balik)
      .sort((a, b) => (S.rsort === 'v' ? b.cc.vBelum - a.cc.vBelum : b.cc.belum - a.cc.belum));
    add([['#', k === 'br' ? t('rank.br') : k === 'cust' ? t('f.cust') : k === 'reg' ? t('f.reg') : t('f.level'), t('r.not'), t('r.not') + ' (Rp)', t('r.share'), ...SEV.map(x => L(x.label)), t('p.past'), t('p.past') + ' (Rp)', t('r.rr'), t('p.ot')],
      ...list.map((x, i) => { const sc = sevCounts(x.cc.belumRows); return [i + 1, nameOf(k, x.id), x.cc.belum, x.cc.vBelum, r1(pct(x.cc.belum, tot)), sc.hitam, sc.oranye, sc.merah, sc.ungu, x.cc.overD, x.cc.vOverD, r1(pct(x.cc.sudah, x.cc.balik)), r1(pct(x.cc.ontime, x.cc.sudah))]; })], 'Follow-up');
  }
  saveWorkbook(wb, `pod-${key}_${ymd(TODAY)}.xlsx`);
}
function exportModal() {
  if (typeof XLSX === 'undefined') return toast(t('t.lib'));
  const wb = XLSX.utils.book_new(), sp = M.sp, rows = pool(sp), node = NODE[sp.node];
  XLSX.utils.book_append_sheet(wb, sheet([...filterLines(), [pathOf(node.id).map(nl).join(' › ')], ...specLabel(sp).map(([, v]) => ['', v]), [t('m.count'), rows.length], [t('m.val'), sumV(rows)]]), 'Summary');
  XLSX.utils.book_append_sheet(wb, detailSheet(rows.slice().sort((a, b) => (b.age ?? -1) - (a.age ?? -1))), 'AWB');
  saveWorkbook(wb, `pod_${(sp.podp || sp.stpod || node.id).toLowerCase()}_${ymd(TODAY)}.xlsx`);
}

/* ================= hint & toast ================= */
const tip = $('#tip');
let pinned = null;
function showTip(el, x, y) { tip.textContent = el.dataset.tip; tip.hidden = false; const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x + 12)) + 'px'; tip.style.top = (y + 18 + h > window.innerHeight ? Math.max(8, y - h - 10) : y + 18) + 'px'; }
function hideTip() { tip.hidden = true; pinned = null; }
document.addEventListener('pointermove', e => { if (e.pointerType === 'touch' || pinned) return; const el = e.target.closest && e.target.closest('[data-tip]'); if (el && el.dataset.tip) showTip(el, e.clientX, e.clientY); else tip.hidden = true; });
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && el.dataset.tip) { const b = el.getBoundingClientRect(); showTip(el, b.left, b.bottom - 10); } else if (!pinned) tip.hidden = true; });
let toastT;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2600); }

/* ================= event ================= */
document.addEventListener('click', e => {
  const tg = e.target;
  const inf = tg.closest('.info');
  if (inf) { e.preventDefault(); e.stopPropagation(); const b = inf.getBoundingClientRect(); if (pinned === inf) hideTip(); else { showTip(inf, b.left, b.bottom - 10); pinned = inf; } return; }
  if (pinned) hideTip();
  // date picker
  if (!$('#dp').hidden && !tg.closest('#dp') && !tg.closest('#f-range')) closeDP();
  if (tg.closest('#f-range')) { $('#dp').hidden ? openDP() : closeDP(); return; }
  const dpd = tg.closest('[data-dpday]'); if (dpd) return pickDay(+dpd.dataset.dpday);
  const dpn = tg.closest('[data-dpnav]'); if (dpn) { DP.m += +dpn.dataset.dpnav; if (DP.m < 0) { DP.m = 11; DP.y--; } if (DP.m > 11) { DP.m = 0; DP.y++; } return renderDP(); }
  const dpq = tg.closest('[data-dpq]'); if (dpq) { const [a, b] = dpq.dataset.dpq.split(',').map(Number); S.from = a; S.to = b; closeDP(); return render(); }
  const pm = tg.closest('[data-pmode]'); if (pm) { S.pmode = pm.dataset.pmode; render(); if (S.pmode === 'range') openDP(); return; }
  const lg = tg.closest('[data-lang]'); if (lg) { LANG = lg.dataset.lang; remember(); applyStatic(); render(); if (P.on) showSlide(); return; }

  const inModal = tg.closest('#dialog');
  const open = tg.closest('[data-open]');
  if (inModal) {
    if (tg.closest('#dlg-close')) return closeModal();
    if (tg.closest('#m-back')) { M.awb = null; return renderModal(true); }
    if (tg.closest('#m-apply')) return applyToDashboard();
    const reset = sp => { M.sp = sp; M.awb = null; M.page = 0; M.q = ''; renderModal(true); };
    const aw = tg.closest('[data-awb]'); if (aw) { M.awb = aw.dataset.awb; return renderModal(true); }
    const doc = tg.closest('[data-mdoc]'); if (doc) return reset({ node: 'balik', ...JSON.parse(doc.dataset.mdoc) });
    const mj = tg.closest('[data-mjump]'); if (mj) return reset({ node: mj.dataset.mjump });
    const mjs = tg.closest('[data-mjumpsev]'); if (mjs) return reset({ node: 'belum', sev: mjs.dataset.mjumpsev });
    const mn = tg.closest('[data-mnode]'); if (mn) { M.sp = { ...M.sp, node: mn.dataset.mnode }; M.page = 0; return renderModal(); }
    const mu = tg.closest('[data-munset]'); if (mu) { const sp = { ...M.sp }; delete sp[mu.dataset.munset]; M.sp = sp; M.page = 0; return renderModal(); }
    const ms = tg.closest('[data-msev]'); if (ms) { const sp = { ...M.sp }; delete sp.bk; if (sp.sev === ms.dataset.msev) delete sp.sev; else sp.sev = ms.dataset.msev; M.sp = sp; M.page = 0; return renderModal(); }
    if (open) { const o = JSON.parse(open.dataset.open); if (M.awb) return reset(o); const sp = { ...M.sp }; delete sp.bk; sp.sev = o.sev; M.sp = sp; M.page = 0; return renderModal(); }
    const mr = tg.closest('[data-mrefine]'); if (mr) { M.sp = { ...M.sp, ...JSON.parse(mr.dataset.mrefine) }; M.page = 0; return renderModal(); }
    const so = tg.closest('[data-msort]'); if (so) { const k = so.dataset.msort; M.dir = M.sort === k ? -M.dir : (k === 'age' ? -1 : 1); M.sort = k; return renderModal(); }
    const pg = tg.closest('[data-mpage]'); if (pg) { M.page += +pg.dataset.mpage; return renderModal(); }
    if (tg.closest('#m-export')) return exportModal();
    return;
  }
  if (open) return openModal(JSON.parse(open.dataset.open));
  if (tg === $('#modal')) return closeModal();
  const f = tg.closest('[data-filter]');
  if (f) {
    const k = f.dataset.filter;
    if (k === 'branch') { S.branch = f.dataset.val; S.btype = ''; S.lv = ''; S.reg = ''; } else S[k] = f.dataset.val;
    S.rankAll = false; render(); if (k !== 'scope') window.scrollTo({ top: 0, behavior: 'smooth' });
    return toast(t('t.filtered', { x: k === 'scope' ? t('sc.' + f.dataset.val) : nameOf(k === 'branch' ? 'br' : k, f.dataset.val) }));
  }
  const c = tg.closest('[data-clear]'); if (c) { if (c.dataset.clear === '*') ['cust', 'scope', 'reg', 'btype', 'lv', 'branch'].forEach(k => { S[k] = ''; }); else S[c.dataset.clear] = ''; return render(); }
  const ww = tg.closest('[data-ww]'); if (ww) { S.ww = ww.dataset.ww; remember(); buildCalendar(S.ww); computeAges(); return render(); }
  const am = tg.closest('[data-am]'); if (am) { S.am = am.dataset.am; remember(); return renderAging(); }
  if (tg.closest('#view-save')) { try { localStorage.setItem('pod-my-view', JSON.stringify(Object.fromEntries(VIEW_KEYS.map(k => [k, S[k]])))); } catch (e) { /* abaikan */ } render(); return toast(t('t.viewSaved')); }
  if (tg.closest('#view-clear')) { try { localStorage.removeItem('pod-my-view'); } catch (e) { /* abaikan */ } render(); return toast(t('t.viewCleared')); }
  const xp = tg.closest('[data-xport]'); if (xp) return exportGroup(xp.dataset.xport);
  const fv = tg.closest('[data-fv]'); if (fv) { S.fv = fv.dataset.fv; return renderTree(); }
  const at = tg.closest('[data-at]'); if (at) { S.at = at.dataset.at; return renderTabs(); }
  const tl = tg.closest('[data-tl]'); if (tl && !tl.disabled) { S.tl = tl.dataset.tl; return renderTree(); }
  const pv = tg.closest('[data-pv]'); if (pv) { S.pv = pv.dataset.pv; return renderPerf(); }
  const av = tg.closest('[data-av]'); if (av) { S.av = av.dataset.av; return renderAging(); }
  if (tg.closest('#totop')) { window.scrollTo({ top: 0, behavior: REDUCED.matches ? 'auto' : 'smooth' }); return; }
  const nav = tg.closest('[data-nav]'); if (nav) { e.preventDefault(); const el = document.getElementById(nav.dataset.nav); if (el) el.scrollIntoView({ behavior: REDUCED.matches ? 'auto' : 'smooth', block: 'start' }); return; }
  const bs = tg.closest('[data-basis]'); if (bs) { S.basis = bs.dataset.basis; remember(); computeAges(); return render(); }
  const mt = tg.closest('[data-metric]'); if (mt) { S.metric = mt.dataset.metric; return renderAging(); }
  const rs = tg.closest('[data-rsort]'); if (rs) { S.rsort = rs.dataset.rsort; return renderRank(); }
  const rk = tg.closest('[data-rank]'); if (rk) { S.rank = rk.dataset.rank; S.rankAll = false; remember(); return renderRank(); }
  if (tg.closest('#rank-more')) { S.rankAll = !S.rankAll; return renderRank(); }
  if (tg.closest('#export-all')) return exportAll();
  if (tg.closest('#present')) return enterPresent();
  if (tg.closest('#p-prev')) return moveSlide(-1);
  if (tg.closest('#p-next')) return moveSlide(1);
  if (tg.closest('#p-exit')) return exitPresent();
});
document.addEventListener('input', e => { if (e.target.id === 'm-q') { M.q = e.target.value; M.page = 0; const pos = e.target.selectionStart; renderModal(); const q = $('#m-q'); q.focus(); q.setSelectionRange(pos, pos); } });
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'f-period') { S.period = +e.target.value; return render(); }
  const k = { 'f-cust': 'cust', 'f-scope': 'scope', 'f-reg': 'reg', 'f-btype': 'btype', 'f-lv': 'lv', 'f-branch': 'branch' }[id];
  if (k) { S[k] = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('info')) { e.target.click(); return; }
  if (e.key === 'Escape' && !$('#dp').hidden) { closeDP(); $('#f-range').focus(); return; }
  if (P.on && $('#modal').hidden) {
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); return moveSlide(1); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); return moveSlide(-1); }
    if (e.key === 'Home') return (P.i = 0, showSlide());
    if (e.key === 'End') return (P.i = SLIDES.length - 1, showSlide());
    if (e.key === 'Escape') return exitPresent();
  }
  if ($('#modal').hidden) return;
  if (e.key === 'Escape') { if (M.awb) { M.awb = null; return renderModal(true); } return closeModal(); }
  if (e.key === 'Tab') { const fs = [...$('#dialog').querySelectorAll('button:not([disabled]),input,.info')]; if (!fs.length) return;
    if (e.shiftKey && document.activeElement === fs[0]) { e.preventDefault(); fs[fs.length - 1].focus(); } else if (!e.shiftKey && document.activeElement === fs[fs.length - 1]) { e.preventDefault(); fs[0].focus(); } }
});

/* ================= init ================= */
loadView(); buildCalendar(S.ww); computeAges(); applyStatic(); render();
addEventListener('scroll', () => { $('#totop').hidden = scrollY < 600; if (scrollY < 120) document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === 's-now')); }, { passive: true });
document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === 's-now'));
if (window.claude) window.claude.use('downloads').then(d => { if (!d) { const b = $('#export-all'); b.disabled = true; b.dataset.tip = t('t.na'); } });
})();
</script>
