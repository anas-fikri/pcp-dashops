<title>POD Performance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: kondisi saat ini (status + 5 angka) → alur status → warna umur & kinerja → aging → siapa yang ditindaklanjuti. Detail selalu di modal. */
:root {
  --bg: #f7f6f4; --card: #ffffff; --soft: #f1efec; --hi: #eef2f8;
  --ink: #26282d; --muted: #5d6169; --line: #e4e1dc;
  --accent: #2f4a6d; --accent-strong: #233a57; --on-accent: #ffffff; --accent-soft: #dfe7f2;
  --success: #1a7a43; --success-soft: #e3f3ea;
  --sev-hitam: #3d4049; --sev-oranye: #e8930c; --sev-merah: #b3202a; --sev-ungu: #7b2fbe;
  --sev-oranye-ink: #9a5800; --on-sev: #ffffff; --on-oranye: #26282d;
  --soft-hitam: #e9e9eb; --soft-oranye: #fdf1dc; --soft-merah: #fbe4e5; --soft-ungu: #f1e6fa;
  --tip-bg: #26282d; --tip-ink: #ffffff;
  --shadow: 0 1px 2px rgba(38,40,45,.05), 0 6px 20px rgba(38,40,45,.05);
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-lg: 20px; --r-sm: 8px; --r-pill: 9999px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17181b; --card: #212328; --soft: #2a2c31; --hi: #263246;
  --ink: #f1f0ee; --muted: #a9acb3; --line: #34363c;
  --accent: #8fb3e3; --accent-strong: #adc8ec; --on-accent: #17181b; --accent-soft: #263246;
  --success: #4cc383; --success-soft: #1d3a2a;
  --sev-hitam: #c9ccd3; --sev-oranye: #f5a93c; --sev-merah: #e5484d; --sev-ungu: #b07ce8;
  --sev-oranye-ink: #f5a93c; --on-sev: #17181b; --on-oranye: #17181b;
  --soft-hitam: #30323a; --soft-oranye: #3a2f1a; --soft-merah: #3d2023; --soft-ungu: #33264a;
  --tip-bg: #f1f0ee; --tip-ink: #17181b;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #17181b; --card: #212328; --soft: #2a2c31; --hi: #263246;
  --ink: #f1f0ee; --muted: #a9acb3; --line: #34363c;
  --accent: #8fb3e3; --accent-strong: #adc8ec; --on-accent: #17181b; --accent-soft: #263246;
  --success: #4cc383; --success-soft: #1d3a2a;
  --sev-hitam: #c9ccd3; --sev-oranye: #f5a93c; --sev-merah: #e5484d; --sev-ungu: #b07ce8;
  --sev-oranye-ink: #f5a93c; --on-sev: #17181b; --on-oranye: #17181b;
  --soft-hitam: #30323a; --soft-oranye: #3a2f1a; --soft-merah: #3d2023; --soft-ungu: #33264a;
  --tip-bg: #f1f0ee; --tip-ink: #17181b;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 700; display: inline-flex; align-items: center; }
.muted { color: var(--muted); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.top h1 { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
.top .meta { color: var(--muted); font-size: 13px; }
.top .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: var(--r-pill); padding: 3px 10px; font-size: 12px; font-weight: 600; letter-spacing: .02em; }
.pill.sim { background: var(--soft); color: var(--muted); border: 1px dashed var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--muted); background: var(--card); border-radius: var(--r-pill); padding: 8px 16px; font-weight: 600; font-size: 13px; cursor: pointer; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-strong); }
.btn.sm { padding: 5px 12px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-pill); padding: 3px; background: var(--card); }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: var(--r-pill); cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

/* hint (i) */
.info { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--muted); color: var(--muted);
  font-size: 10.5px; font-weight: 700; font-style: normal; margin-left: 6px; cursor: help; flex: none; text-transform: none; letter-spacing: 0; vertical-align: 1px; }
.info:hover, .info:focus-visible { background: var(--ink); color: var(--card); border-color: var(--ink); }
.desc { display: block; font-size: 12px; color: var(--muted); font-weight: 400; line-height: 1.35; white-space: normal; }

/* mention berwarna: teks yang menyebut warna ikut berlatar warna itu */
.mention { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px; border-radius: var(--r-pill); font-weight: 700; }
.m-ungu { background: var(--soft-ungu); color: var(--sev-ungu); } .m-merah { background: var(--soft-merah); color: var(--sev-merah); }
.m-oranye { background: var(--soft-oranye); color: var(--sev-oranye-ink); } .m-hitam { background: var(--soft-hitam); color: var(--ink); }
.m-ok { background: var(--success-soft); color: var(--success); }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.field { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; position: relative; }
.field .lbl { display: inline-flex; align-items: center; }
.filters select, .rangebtn { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--card); border: 1px solid var(--muted); border-radius: var(--r-sm); padding: 7px 10px; min-width: 140px; max-width: 100%; }
.rangebtn { cursor: pointer; text-align: left; display: inline-flex; gap: 10px; align-items: center; justify-content: space-between; min-width: 210px; }
.period { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filters .arrow { color: var(--muted); align-self: center; padding-top: 18px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); border-radius: var(--r-pill); padding: 4px 10px; font-size: 12.5px; cursor: pointer; }
.chip:hover { border-color: var(--muted); }
.chip.on { background: var(--hi); border-color: var(--accent); }
.chip .x { font-weight: 700; color: var(--muted); }

/* date range picker */
.dp { position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 40px rgba(0,0,0,.18);
  padding: 14px; width: max-content; max-width: calc(100vw - 32px); color: var(--ink); font-weight: 400; letter-spacing: 0; }
.dp-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.dp-head b { font-size: 13px; }
.dp-nav { border: 1px solid var(--line); background: var(--card); border-radius: 50%; width: 30px; height: 30px; cursor: pointer; }
.dp-months { display: flex; flex-wrap: wrap; gap: 18px; }
.dp-month h4 { margin: 0 0 6px; font-size: 13px; text-align: center; }
.dp-grid { display: grid; grid-template-columns: repeat(7, 34px); gap: 2px 0; }
.dp-grid .wd { font-size: 11px; color: var(--muted); text-align: center; padding: 2px 0; }
.dp-grid button { height: 32px; border: 0; background: none; cursor: pointer; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.dp-grid button:hover:not([disabled]) { background: var(--soft); border-radius: 8px; }
.dp-grid button.in { background: var(--accent-soft); border-radius: 0; }
.dp-grid button.a, .dp-grid button.b { background: var(--accent); color: var(--on-accent); border-radius: 8px; font-weight: 700; }
.dp-grid button.today { box-shadow: inset 0 0 0 1px var(--muted); border-radius: 8px; }
.dp-grid button[disabled] { color: var(--muted); opacity: .35; cursor: default; }
.dp-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12.5px; }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px 22px; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; margin-bottom: 2px; }
.card .sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 14px; max-width: 80ch; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }

/* kondisi saat ini */
.now { display: grid; gap: 14px; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; border-radius: 14px; border: 1px solid transparent; }
.status .ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; flex: none; }
.status .what { font-size: 16px; font-weight: 800; }
.status .reasons { font-size: 14px; display: inline-flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.status .reasons .go { text-decoration: none; display: inline-flex; }
.status .reasons .go:hover .mention { box-shadow: 0 0 0 1px currentColor; }
.s-ok { background: var(--success-soft); } .s-ok .ic { background: var(--success); color: var(--card); }
.s-oranye { background: var(--soft-oranye); } .s-oranye .ic { background: var(--sev-oranye); color: var(--on-oranye); }
.s-merah { background: var(--soft-merah); } .s-merah .ic { background: var(--sev-merah); color: var(--on-sev); }
.s-ungu { background: var(--soft-ungu); border-color: var(--sev-ungu); }
.s-ungu .m-ungu { background: var(--sev-ungu); color: var(--on-sev); } .s-ungu .ic { background: var(--sev-ungu); color: var(--on-sev); } .s-ungu .what { color: var(--sev-ungu); }
.focus { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13.5px; }
.focus .k { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi { position: relative; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 14px 16px 12px; cursor: pointer; display: grid; gap: 6px; align-content: start; }
.kpi:hover { border-color: var(--muted); background: var(--soft); }
.kpi .lbl { font-size: 13px; font-weight: 700; display: flex; align-items: center; }
.kpi .val { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.kpi .val b { font-size: 30px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .val span { font-size: 13px; font-weight: 700; padding: 1px 8px; border-radius: var(--r-pill); background: var(--soft); font-variant-numeric: tabular-nums; }
.kpi .say { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.kpi .bar-top { position: absolute; left: 16px; right: 16px; top: 0; height: 3px; border-radius: 0 0 3px 3px; }
.meter { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; display: flex; }
.meter > span { display: block; height: 100%; }
.go-more { font-size: 12px; font-weight: 700; color: var(--accent); }

/* severity */
.sevbar { display: flex; height: 12px; border-radius: 4px; overflow: hidden; background: var(--soft); min-width: 90px; }
.sevbar.lg { height: 26px; border-radius: 6px; }
.sevbar > span { display: block; height: 100%; border-right: 2px solid var(--card); cursor: pointer; }
.sevbar > span:last-child { border-right: 0; }
.sevbar > span:hover { filter: brightness(1.15); }
.bg-hitam { background: var(--sev-hitam); } .bg-oranye { background: var(--sev-oranye); } .bg-merah { background: var(--sev-merah); } .bg-ungu { background: var(--sev-ungu); }
.t-ungu { color: var(--sev-ungu); } .t-merah { color: var(--sev-merah); } .t-oranye { color: var(--sev-oranye-ink); } .t-hitam { color: var(--ink); } .t-ok { color: var(--success); }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.legend { display: grid; gap: 2px; margin-top: 12px; }
.legend button { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 10px; align-items: center; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: var(--r-sm); cursor: pointer; }
.legend button:hover { background: var(--soft); }
.legend .n { font-weight: 700; font-variant-numeric: tabular-nums; }
.legend .p { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
.age { display: inline-block; min-width: 34px; text-align: center; border-radius: 6px; padding: 1px 7px; font-weight: 700; font-size: 12.5px; color: var(--on-sev); font-variant-numeric: tabular-nums; }
.age.bg-oranye { color: var(--on-oranye); }

/* links */
.go { color: inherit; font-weight: 700; text-decoration: underline; text-decoration-color: var(--muted); text-decoration-style: dotted; text-underline-offset: 3px; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; font-weight: 700; }
.go:hover { text-decoration-color: var(--accent); text-decoration-style: solid; }
.go.t-ungu, .go.t-merah, .go.t-oranye { text-decoration-color: currentColor; }

/* tables */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; vertical-align: middle; }
th { font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
th:first-child, td:first-child, .l { text-align: left; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover td, tr.flash td { background: var(--hi); }
tr.flash td { transition: background 1.2s; }
tr.d0 td:first-child b, tr.d1 td:first-child b, tr.d2 td:first-child b { font-weight: 800; }
tr.grp td { background: var(--soft); font-weight: 700; color: var(--muted); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; text-align: left; }
tr.tot td { font-weight: 800; }
td.z { color: var(--muted); opacity: .6; }
td.status-cell { white-space: normal; min-width: 220px; }
.pbar { display: inline-grid; grid-template-columns: 56px 52px; gap: 8px; align-items: center; }

/* aging: angka berwarna */
.hm td.c { cursor: pointer; padding: 6px 10px; border-radius: 6px; }
.hm td.c:hover { background: var(--soft); }
.hm td.c > span { display: grid; line-height: 1.2; }
.hm td.c b { font-size: 15px; font-weight: 800; }
.hm td.c small { font-size: 11px; color: var(--muted); }
.hm td.c.zero b { color: var(--muted); opacity: .5; font-weight: 600; }
.hm th.sevh { box-shadow: inset 0 -3px 0 var(--hc); }
.hm .legend-inline { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; }

/* rank */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.rank td.name { max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
.rank td.bar { width: 32%; min-width: 160px; }
.tag { display: inline-block; padding: 1px 8px; border-radius: var(--r-pill); background: var(--soft); color: var(--muted); font-size: 11px; font-weight: 600; margin-left: 6px; }

/* rules */
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 12px 24px; margin-top: 14px; }
.rules div { border-left: 3px solid var(--line); padding-left: 12px; }
.rules b { display: block; }
.rules span { color: var(--muted); font-size: 13px; }
details.card summary { cursor: pointer; font-weight: 700; font-size: 16px; }

/* modal */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(20,20,24,.5); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dialog { background: var(--card); color: var(--ink); border-radius: var(--r-lg); width: min(1180px, 100%); max-height: 100%; overflow: auto; padding: 20px 22px; display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.dlg-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 13px; color: var(--muted); }
.crumbs button { border: 0; background: none; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; font: inherit; }
.crumbs b { color: var(--ink); }
.dlg-title { font-size: 20px; font-weight: 800; letter-spacing: -.01em; margin-top: 2px; }
.x-btn { border: 1px solid var(--line); background: var(--card); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px; flex: none; }
.mstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.mstat { background: var(--soft); border-radius: 14px; padding: 10px 14px; }
.mstat .lbl { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; align-items: center; }
.mstat .val { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.mstat .hint { font-size: 12px; color: var(--muted); }
.why { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 10px 20px; }
.why h3 { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.why button { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; width: 100%; border: 0; background: none; padding: 6px 8px; border-radius: 8px; cursor: pointer; text-align: left; }
.why button:hover { background: var(--soft); }
.why .p { color: var(--muted); min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.tools input { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--card); border: 1px solid var(--muted); border-radius: var(--r-pill); padding: 7px 14px; min-width: min(300px, 100%); }
th.sort { cursor: pointer; user-select: none; }
th.sort:hover { color: var(--ink); }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.awb-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 13.5px; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding-bottom: 14px; position: relative; }
.timeline li::before { content: ""; position: absolute; left: 10px; top: 20px; bottom: 0; width: 2px; background: var(--line); }
.timeline li:last-child::before { display: none; }
.timeline .pt { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; font-size: 11px; font-weight: 800; }
.timeline .pt.done { background: var(--success); border-color: var(--success); color: var(--card); }
.timeline .pt.now { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.timeline b { display: block; }
.timeline span { color: var(--muted); font-size: 12.5px; }

.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); font-size: 12.5px; line-height: 1.45; padding: 8px 11px; border-radius: 8px; max-width: 300px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 70; background: var(--tip-bg); color: var(--tip-ink); padding: 10px 18px; border-radius: var(--r-pill); font-weight: 600; font-size: 13px; }
footer { color: var(--muted); font-size: 12px; text-align: center; }

@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .grid-2 { grid-template-columns: minmax(0, 1fr); } }

try { const saved = JSON.parse(localStorage.getItem('pod-proto-v3') || '{}'); ['ww', 'am', 'rank'].forEach(k => { if (saved[k]) S[k] = saved[k]; }); if (saved.lang) LANG = saved.lang; } catch (e) { /* abaikan */ }
const remember = () => { try { localStorage.setItem('pod-proto-v3', JSON.stringify({ ww: S.ww, am: S.am, rank: S.rank, lang: LANG })); } catch (e) { /* abaikan */ } };
const range = () => (S.pmode === 'preset' ? [TODAY - S.period + 1, TODAY] : [S.from, S.to]);
let F = [];
function inGlobal(r) {
  const [a, b] = range();
  return r.ship >= a && r.ship <= b && (!S.cust || r.cust === S.cust) && (!S.btype || r.btype === S.btype)
    && (!S.branch || r.br === S.branch) && (!S.lv || r.lv === S.lv) && (!S.scope || r.scope === S.scope);
}
function testOf(sp) {
  const n = NODE[sp.node || 'all'];
  return r => n.t(r) && (!sp.scope || r.scope === sp.scope) && (sp.bk == null || r.bk === sp.bk) && (!sp.sev || r.sev === sp.sev)
    && (!sp.br || r.br === sp.br) && (!sp.cust || r.cust === sp.cust) && (!sp.lv || r.lv === sp.lv) && (!sp.btype || r.btype === sp.btype)
    && (!sp.over || r.over) && (!sp.sla || r.sla === sp.sla) && (!sp.podp || r.podp === sp.podp) && (!sp.stpod || r.stpod === sp.stpod);
}
const sevCounts = rows => { const o = { hitam: 0, oranye: 0, merah: 0, ungu: 0 }; rows.forEach(r => { if (r.sev) o[r.sev]++; }); return o; };
const domSev = sc => SEV.reduce((a, x) => (sc[x.k] > sc[a] ? x.k : a), 'hitam');
function groupCount(rows, key) { const m = new Map(); rows.forEach(r => { if (r[key] != null) m.set(r[key], (m.get(r[key]) || 0) + 1); }); return [...m.entries()].sort((a, b) => b[1] - a[1]); }
const nameOf = (key, v) => key === 'br' || key === 'org' ? BR[v].name : key === 'cust' ? CUST[v].name : key === 'lv' ? t('lv.' + v) : key === 'st' ? L(STATUS[v].label) : v;

/* ================= komponen ================= */
function sevBar(counts, base, lg) {
  const tot = SEV.reduce((s, x) => s + counts[x.k], 0);
  if (!tot) return `<div class="sevbar${lg ? ' lg' : ''}"></div>`;
  return `<div class="sevbar${lg ? ' lg' : ''}" role="img" aria-label="${esc(SEV.map(x => `${L(x.label)} ${counts[x.k]}`).join(', '))}">` +
    SEV.filter(x => counts[x.k]).map(x => `<span class="bg-${x.k}" style="width:${(counts[x.k] / tot) * 100}%" data-open="${spec({ ...base, sev: x.k })}"
      data-tip="${esc(t('sevbar.tip', { x: L(x.label), s: L(x.short), n: fmt(counts[x.k]), p: fp(pct(counts[x.k], tot)) }))}"></span>`).join('') + '</div>';
}
const meter = (p, color) => `<div class="meter"><span style="width:${Math.max(0, Math.min(100, p || 0))}%;background:${color}"></span></div>`;
const go = (sp, html, cls = '', tip = '') => `<button type="button" class="go ${cls}" data-open="${spec(sp)}"${tip ? ` data-tip="${esc(tip)}"` : ''}>${html}</button>`;
const mention = (k, html) => `<span class="mention m-${k}">${html}</span>`;

function core(rows) {
  const balik = rows.filter(r => r.req), sudah = balik.filter(r => r.grp === 'S'), belum = balik.filter(r => r.grp !== 'S'), dlv = belum.filter(r => r.grp === 'D');
  return { all: rows.length, balik: balik.length, sudah: sudah.length, belum: belum.length, nd: belum.length - dlv.length, dlv: dlv.length,
    ontime: sudah.filter(r => !r.over).length, overD: dlv.filter(r => r.over).length, ungu: belum.filter(r => r.sev === 'ungu').length,
    avgLead: sudah.length ? sudah.reduce((s, r) => s + r.age, 0) / sudah.length : null, belumRows: belum, sudahRows: sudah };
}

/* ================= render ================= */
function applyStatic() {
  document.documentElement.lang = LANG;
  document.title = t('title');
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-tt]').forEach(el => { el.dataset.tip = t(el.dataset.tt); });
  $('#lang-en').setAttribute('aria-pressed', LANG === 'en'); $('#lang-id').setAttribute('aria-pressed', LANG === 'id');
  $('#f-period').innerHTML = [30, 60, 90, 120, 180].map(n => `<option value="${n}">${esc(t('f.lastN', { n }))}</option>`).join('');
  $('#f-cust').innerHTML = `<option value="">${t('all')}</option>` + CUSTOMERS.map(c => `<option value="${c.code}">${esc(c.name)} · SLA ${c.sla} ${U()}</option>`).join('');
  $('#f-scope').innerHTML = `<option value="">${t('all')}</option>` + ['INTRACITY', 'DOMESTIK'].map(s => `<option value="${s}">${t('sc.' + s)}</option>`).join('');
  $('#f-btype').innerHTML = `<option value="">${t('all')}</option>` + ['INTERNAL', 'AGENT'].map(s => `<option value="${s}">${t('ty.' + s)}</option>`).join('');
  $('#f-lv').innerHTML = `<option value="">${t('all')}</option>` + LEVELS.map(s => `<option value="${s}">${t('lv.' + s)}</option>`).join('');
  renderRules();
}

function render() {
  F = ROWS.filter(inGlobal);
  renderFilters(); renderNow(); renderTree(); renderSev(); renderPerf(); renderAging(); renderRank();
  if (!$('#modal').hidden) renderModal();
}

function renderFilters() {
  const ok = OFFICES.filter(b => (!S.btype || b.type === S.btype) && (!S.lv || b.lv === S.lv));
  if (S.branch && !ok.some(b => b.code === S.branch)) S.branch = '';
  $('#f-branch').innerHTML = `<option value="">${t('allN', { n: ok.length })}</option>` + ok.map(b => `<option value="${b.code}">${esc(b.name)} · ${t('ty.' + b.type)} · ${t('lv.' + b.lv)}</option>`).join('');
  ['cust', 'scope', 'btype', 'lv', 'branch'].forEach(k => { $('#f-' + k).value = S[k]; });
  $('#f-period').value = String(S.period);
  $('#pm-preset').setAttribute('aria-pressed', S.pmode === 'preset'); $('#pm-range').setAttribute('aria-pressed', S.pmode === 'range');
  $('#f-period').hidden = S.pmode !== 'preset'; $('#f-range').hidden = S.pmode !== 'range';
  $('#range-txt').textContent = `${fd(S.from)} – ${fd(S.to)} · ${t('dp.days', { n: S.to - S.from + 1 })}`;
  const items = [];
  if (S.cust) items.push(['cust', CUST[S.cust].name]);
  if (S.scope) items.push(['scope', t('sc.' + S.scope)]);
  if (S.btype) items.push(['btype', t('ty.' + S.btype)]);
  if (S.lv) items.push(['lv', t('lv.' + S.lv)]);
  if (S.branch) items.push(['branch', t('sp.dest', { x: BR[S.branch].name })]);
  $('#active-filters').innerHTML = items.map(([k, v]) => `<button type="button" class="chip on" data-clear="${k}" data-tip="${esc(t('rm'))}">${esc(v)} <span class="x" aria-hidden="true">×</span></button>`).join('')
    + (items.length ? `<button type="button" class="chip" data-clear="*">${t('reset')}</button>` : '');
  const [a, b] = range();
  $('#asof').textContent = t('asof', { d: fd(TODAY), a: fd(a), b: fd(b) });
  $('#now-meta').textContent = t('now.meta', { w: t('ww.' + S.ww) });
  $('#ww-mf').setAttribute('aria-pressed', S.ww === 'mf'); $('#ww-ms').setAttribute('aria-pressed', S.ww === 'ms');
}

function health(c) {
  // dibandingkan dengan angka yang tampil (1 desimal) supaya teks dan status tidak bertentangan
  const pu = r1(pct(c.ungu, c.belum) || 0), pt = r1(pct(c.ontime, c.sudah) ?? 100);
  const uL = pu >= 30 ? 2 : pu >= 15 ? 1 : 0, tL = pt < 60 ? 2 : pt < 80 ? 1 : 0, lvl = Math.max(uL, tL);
  const reasons = [
    { lvl: uL, cls: 'ungu', sp: { node: 'belum', sev: 'ungu' }, txt: t('h.ungu', { p: fp(pu) }) },
    { lvl: tL, cls: tL === 2 ? 'merah' : 'oranye', sp: { node: 'sudah' }, txt: t('h.ot', { p: fp(pt) }) },
  ];
  // hanya alasan yang memicu status; urut dari yang paling berat, ungu lebih dulu bila seri
  let shown = reasons.filter(r => r.lvl > 0).sort((a, b) => b.lvl - a.lvl);
  if (!shown.length) shown = reasons.map(r => ({ ...r, cls: 'ok' }));
  return { lvl, driver: lvl ? shown[0].cls : 'ok', shown, word: t(lvl === 2 ? 'h.crit' : lvl === 1 ? 'h.warn' : 'h.good') };
}

function renderNow() {
  const c = core(F), sc = sevCounts(c.belumRows), h = health(c);
  $('#status').className = 'status s-' + h.driver;
  $('#status').innerHTML = `<span class="ic" aria-hidden="true">${h.lvl === 2 ? '!' : h.lvl === 1 ? '~' : '✓'}</span><span class="what">${esc(h.word)}</span>
    <span class="reasons">${h.shown.map(r => go(r.sp, mention(r.cls, esc(r.txt)))).join(`<span class="muted">${t('h.and')}</span>`)}</span>${info(t('h.rule'))}`;
  const tot = SEV.reduce((s, x) => s + sc[x.k], 0) || 1;
  const sevMini = `<div class="meter">${SEV.map(x => `<span class="bg-${x.k}" style="width:${(sc[x.k] / tot) * 100}%"></span>`).join('')}</div>`;
  const tile = (sp, color, lbl, hint, big, badge, say, bar) => `<button type="button" class="kpi" data-open="${spec(sp)}">
    <span class="bar-top" style="background:${color}"></span><span class="lbl">${lbl}${info(hint)}</span>
    <span class="val"><b>${big}</b>${badge ? `<span>${badge}</span>` : ''}</span>${bar}<span class="say">${say}</span><span class="go-more">${t('seeAwb')}</span></button>`;
  $('#kpis').innerHTML = [
    tile({ node: 'balik' }, 'var(--muted)', t('k1'), L(NODE.balik.def), fmt(c.balik), fp(pct(c.balik, c.all)), esc(t('k1.say', { n: fmt(c.all) })), meter(pct(c.balik, c.all), 'var(--muted)')),
    tile({ node: 'sudah' }, 'var(--success)', t('k2'), L(NODE.sudah.def), fp(pct(c.sudah, c.balik)), fmt(c.sudah), esc(t('k2.say', { n: fmt(c.balik) })), meter(pct(c.sudah, c.balik), 'var(--success)')),
    tile({ node: 'belum' }, 'var(--sev-ungu)', t('k3'), L(NODE.belum.def), fmt(c.belum), fp(pct(c.belum, c.balik)), `${mention('ungu', esc(t('k3.crit', { n: fmt(c.ungu) })))} ${esc(t('k3.say', { nd: fmt(c.nd) }))}`, sevMini),
    tile({ node: 'dlv', over: true }, 'var(--sev-merah)', t('k4'), t('k4.tip'), fmt(c.overD), fp(pct(c.overD, c.dlv)), esc(t('k4.say', { n: fmt(c.dlv) })), meter(pct(c.overD, c.dlv), 'var(--sev-merah)')),
    tile({ node: 'sudah' }, 'var(--success)', t('k5'), t('k5.tip'), fp(pct(c.ontime, c.sudah)), fmt(c.ontime), esc(t('k5.say', { d: fday(c.avgLead) })), meter(pct(c.ontime, c.sudah), 'var(--success)')),
  ].join('');
  const topBr = groupCount(c.belumRows, 'br')[0], topSt = groupCount(c.belumRows, 'st')[0], topCu = groupCount(c.belumRows, 'cust')[0];
  $('#focus').innerHTML = topBr ? `<span class="k">${t('focus')}</span>
    <span>${t('focus.br', { x: go({ node: 'belum', br: topBr[0] }, esc(BR[topBr[0]].name)), n: fmt(topBr[1]), p: fp(pct(topBr[1], c.belum)) })}</span><span class="muted">·</span>
    <span>${t('focus.cu', { x: go({ node: 'belum', cust: topCu[0] }, esc(CUST[topCu[0]].name)), n: fmt(topCu[1]) })}</span><span class="muted">·</span>
    <span>${t('focus.st', { x: go({ node: topSt[0] }, esc(L(STATUS[topSt[0]].label))), n: fmt(topSt[1]) })}</span>` : `<span class="muted">${t('focus.none')}</span>`;
}

function renderTree() {
  const cnt = Object.fromEntries(NODES.map(n => [n.id, F.filter(n.t)]));
  const balikN = cnt.balik.length;
  let h = `<thead><tr><th>${t('c.status')}${info(t('c.status.tip'))}</th><th>${t('c.count')}</th><th>${t('c.parent')}${info(t('c.parent.tip'))}</th><th>${t('c.ofRet')}${info(t('c.ofRet.tip'))}</th><th>${t('sc.INTRACITY')}</th><th>${t('sc.DOMESTIK')}</th><th class="l">${t('c.colour')}${info(t('c.colour.tip'))}</th></tr></thead><tbody>`;
  for (const n of NODES) {
    const rows = cnt[n.id], N = rows.length;
    const p = n.p ? pct(N, cnt[n.p].length) : null, pb = n.d >= 2 ? pct(N, balikN) : null;
    const nI = rows.filter(r => r.scope === 'INTRACITY').length;
    h += `<tr class="d${n.d} clickable" id="row-${n.id}" data-open="${spec({ node: n.id })}">
      <td class="status-cell" style="padding-left:${10 + n.d * 18}px"><b>${esc(L(n.label))}</b>${info(L(n.def))}<span class="desc">${esc(L(n.short))}</span></td>
      <td><b>${fmt(N)}</b></td>
      <td>${p == null ? '' : `<span class="pbar"><span class="meter"><span style="width:${p}%;background:var(--accent)"></span></span><span>${fp(p)}</span></span>`}</td>
      <td class="muted">${pb == null ? '' : fp(pb)}</td>
      <td class="${nI ? '' : 'z'}">${nI ? go({ node: n.id, scope: 'INTRACITY' }, fmt(nI)) : 0}</td>
      <td class="${N - nI ? '' : 'z'}">${N - nI ? go({ node: n.id, scope: 'DOMESTIK' }, fmt(N - nI)) : 0}</td>
      <td class="l">${n.d >= 2 ? sevBar(sevCounts(rows), { node: n.id }) : ''}</td></tr>`;
  }
  $('#tree').innerHTML = h + '</tbody>';
}

function renderSev() {
  const c = core(F), sc = sevCounts(c.belumRows);
  $('#sev-sub').textContent = t('sev.sub', { n: fmt(c.belum) });
  $('#sev-panel').innerHTML = sevBar(sc, { node: 'belum' }, true) + '<div class="legend">' + SEV.map(x => `
    <button type="button" data-open="${spec({ node: 'belum', sev: x.k })}" data-tip="${esc(L(x.def) + ' ' + sevRanges(x) + '.')}">
      <span class="dot bg-${x.k}"></span><span><b class="t-${x.k}">${L(x.label)}</b> · ${L(x.short)}<span class="desc">${sevRanges(x)}</span></span>
      <span class="n t-${x.k}">${fmt(sc[x.k])}</span><span class="p">${fp(pct(sc[x.k], c.belum))}</span></button>`).join('') + '</div>';
}

function renderPerf() {
  const groups = [
    [t('sc.INTRACITY'), t('g.intra'), { scope: 'INTRACITY' }, r => r.scope === 'INTRACITY'],
    [t('sc.DOMESTIK'), t('g.dom'), { scope: 'DOMESTIK' }, r => r.scope === 'DOMESTIK'],
    [t('g.sla', { n: 6 }), t('g.sla.d', { n: 6 }), { sla: 6 }, r => r.sla === 6],
    [t('g.sla', { n: 7 }), t('g.sla.d', { n: 7 }), { sla: 7 }, r => r.sla === 7],
    [t('ty.INTERNAL'), t('g.int'), { btype: 'INTERNAL' }, r => r.btype === 'INTERNAL'],
    [t('ty.AGENT'), t('g.agent'), { btype: 'AGENT' }, r => r.btype === 'AGENT'],
  ];
  let h = `<thead><tr><th>${t('p.group')}</th><th>${t('p.ret')}</th><th>${t('p.avg')}${info(t('p.avg.tip'))}</th><th class="l">${t('p.ot')}${info(t('p.ot.tip'))}</th><th>${t('p.past')}${info(t('p.past.tip'))}</th></tr></thead><tbody>`;
  for (const [lbl, short, sp, tf] of groups) {
    const c = core(F.filter(tf)), p = pct(c.ontime, c.sudah);
    h += `<tr><td class="l"><b>${esc(lbl)}</b><span class="desc">${esc(short)}</span></td><td>${c.sudah ? go({ node: 'sudah', ...sp }, fmt(c.sudah)) : 0}</td><td>${fday(c.avgLead)}</td>
      <td class="l"><span class="pbar"><span class="meter"><span style="width:${p || 0}%;background:var(--success)"></span></span><span>${fp(p)}</span></span></td>
      <td>${c.overD ? go({ node: 'dlv', over: true, ...sp }, fmt(c.overD), 't-merah') : 0}</td></tr>`;
  }
  $('#perf').innerHTML = h + '</tbody>';
}

function renderAging() {
  $('#am-bucket').setAttribute('aria-pressed', S.am === 'bucket'); $('#am-sev').setAttribute('aria-pressed', S.am === 'sev');
  const cols = S.am === 'bucket'
    ? BUCKETS.map(b => ({ label: `${b.label} ${U()}`, tip: t('bucket.tip', { x: b.label }), sp: { bk: b.i }, f: r => r.bk === b.i }))
    : SEV.map(s => ({ label: L(s.label), tip: `${L(s.short)}. ${sevRanges(s)}`, sev: s.k, sp: { sev: s.k }, f: r => r.sev === s.k }));
  const sections = [['aging.s1', ['ND', 'dlv', 'MDP', 'PODC', 'REDOC', 'UPLOAD'], 'belum'], ['aging.s2', ['STPOD', 'PODP', 'ARSIP'], 'sudah']];
  let h = `<thead><tr><th>${t('c.status')}</th>${cols.map(c => `<th${c.sev ? ` class="sevh" style="--hc:var(--sev-${c.sev})"` : ''}>${esc(c.label)}${info(c.tip)}</th>`).join('')}<th>${t('total')}</th></tr></thead>`;
  for (const [title, ids, tot] of sections) {
    h += `<tbody><tr class="grp"><td colspan="${cols.length + 2}">${t(title)}</td></tr>`;
    for (const id of [...ids, tot]) {
      const rows = F.filter(NODE[id].t), n = rows.length, isTot = id === tot;
      const rowDom = domSev(sevCounts(rows));
      h += `<tr class="${isTot ? 'tot' : ''}"><td style="padding-left:${['MDP', 'PODC', 'REDOC', 'UPLOAD'].includes(id) ? 28 : 10}px;${id === 'dlv' ? 'font-weight:700' : ''}">${isTot ? esc(t('totalX', { x: nl(id) })) : esc(nl(id)) + info(L(NODE[id].def))}</td>` +
        cols.map(col => {
          const cr = rows.filter(col.f), v = cr.length, dom = col.sev || domSev(sevCounts(cr));
          return `<td class="c ${v ? '' : 'zero'}" data-open="${spec({ node: id, ...col.sp })}" data-tip="${esc(t('cell.tip', { r: nl(id), c: col.label, n: fmt(v), p: fp(pct(v, n)), s: L(SEVK[dom].label) }))}"><span><b class="t-${v ? dom : 'hitam'}">${fmt(v)}</b><small>${v ? fp(pct(v, n)) : ''}</small></span></td>`;
        }).join('') + `<td>${go({ node: id }, fmt(n), 't-' + (n ? rowDom : 'hitam'))}</td></tr>`;
    }
    h += '</tbody>';
  }
  $('#aging').innerHTML = h;
}

function renderRank() {
  document.querySelectorAll('#rank-tabs [data-rank]').forEach(b => b.classList.toggle('on', b.dataset.rank === S.rank));
  const key = S.rank;
  const list = [...new Set(F.map(r => r[key]))].map(id => { const c = core(F.filter(r => r[key] === id)); return { id, c, sc: sevCounts(c.belumRows) }; })
    .filter(x => x.c.balik).sort((a, b) => b.c.belum - a.c.belum || String(a.id).localeCompare(String(b.id)));
  const totalBelum = core(F).belum, show = S.rankAll ? list : list.slice(0, 10);
  const head = key === 'br' ? t('rank.br') : key === 'cust' ? t('f.cust') : t('f.level');
  let h = `<thead><tr><th>${head}</th><th>${t('r.not')}${info(t('r.not.tip'))}</th><th>${t('r.share')}${info(t('r.share.tip'))}</th>
    <th class="l">${t('c.colour')}${info(t('c.colour.tip'))}</th><th>${t('p.past')}${info(t('p.past.tip'))}</th><th>${t('r.rr')}${info(t('r.rr.tip'))}</th><th>${t('p.ot')}${info(t('p.ot.tip'))}</th></tr></thead><tbody>`;
  for (const x of show) {
    const nm = nameOf(key, x.id);
    const sub = key === 'br' ? `${t('ty.' + BR[x.id].type)} · ${t('lv.' + BR[x.id].lv)}` : key === 'cust' ? `SLA ${CUST[x.id].sla} ${U()}` : t('r.lvdesc');
    const fk = key === 'br' ? 'branch' : key;
    const otp = pct(x.c.ontime, x.c.sudah);
    h += `<tr><td class="name l"><button type="button" class="go" data-filter="${fk}" data-val="${esc(x.id)}" data-tip="${esc(t('r.filterTo', { x: nm }))}">${esc(nm)}</button><span class="desc">${esc(sub)}</span></td>
      <td>${x.c.belum ? go({ node: 'belum', [key]: x.id }, fmt(x.c.belum)) : 0}</td><td>${fp(pct(x.c.belum, totalBelum))}</td>
      <td class="bar l">${sevBar(x.sc, { node: 'belum', [key]: x.id })}</td>
      <td>${x.c.overD ? go({ node: 'dlv', over: true, [key]: x.id }, fmt(x.c.overD), 't-merah') : 0}</td>
      <td>${fp(pct(x.c.sudah, x.c.balik))}</td><td class="${(otp ?? 100) < 60 ? 't-merah' : ''}">${fp(otp)}</td></tr>`;
  }
  $('#rank').innerHTML = h + '</tbody>';
  const more = $('#rank-more');
  more.hidden = list.length <= 10;
  more.textContent = S.rankAll ? t('r.top') : t('r.more', { n: list.length });
}

function renderRules() {
  const items = [
    ...NODES.filter(n => n.id !== 'all').map(n => [L(n.label), L(n.def)]),

/* ================= date range picker ================= */
const DP = { a: null, b: null, y: 0, m: 0 };
function openDP() {
  DP.a = S.from; DP.b = S.to;
  const d = dDate(S.to); DP.y = d.getUTCFullYear(); DP.m = d.getUTCMonth() - (window.innerWidth >= 700 ? 1 : 0);
  if (DP.m < 0) { DP.m += 12; DP.y--; }
  $('#dp').hidden = false; renderDP();
}
const closeDP = () => { $('#dp').hidden = true; };
function renderDP() {
  const months = window.innerWidth >= 700 ? 2 : 1;
  const wdNames = [...Array(7)].map((_, i) => dDate(dayOf(2024, 0, 1) + i).toLocaleDateString(LOC(), { weekday: 'short', timeZone: 'UTC' }));
  let html = `<div class="dp-head"><button type="button" class="dp-nav" data-dpnav="-1" aria-label="${t('dp.prev')}">‹</button><b>${DP.b == null ? t('dp.end') : t('dp.start')}</b><button type="button" class="dp-nav" data-dpnav="1" aria-label="${t('dp.next')}">›</button></div><div class="dp-months">`;
  for (let k = 0; k < months; k++) {
    let y = DP.y, m = DP.m + k; if (m > 11) { m -= 12; y++; }
    const first = dayOf(y, m, 1), days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate(), lead = (dDate(first).getUTCDay() + 6) % 7;
    html += `<div class="dp-month"><h4>${dDate(first).toLocaleDateString(LOC(), { month: 'long', year: 'numeric', timeZone: 'UTC' })}</h4><div class="dp-grid">${wdNames.map(w => `<span class="wd">${esc(w)}</span>`).join('')}${'<span></span>'.repeat(lead)}`;
    for (let i = 0; i < days; i++) {
      const d = first + i, cls = [];
      if (DP.a != null && DP.b != null && d > DP.a && d < DP.b) cls.push('in');
      if (d === DP.a) cls.push('a'); if (d === DP.b) cls.push('b'); if (d === TODAY) cls.push('today');
      html += `<button type="button" data-dpday="${d}" class="${cls.join(' ')}" ${d > TODAY || d < BASE + 10 ? 'disabled' : ''}>${i + 1}</button>`;
    }
    html += '</div></div>';
  }
  const tm = dDate(TODAY), y = tm.getUTCFullYear(), m = tm.getUTCMonth();
  html += `</div><div class="dp-foot"><span class="chips"><button type="button" class="chip" data-dpq="${dayOf(y, m, 1)},${TODAY}">${t('dp.thisM')}</button><button type="button" class="chip" data-dpq="${dayOf(y, m - 1, 1)},${dayOf(y, m, 0)}">${t('dp.lastM')}</button></span>
    <span class="muted">${DP.a != null ? `${fd(DP.a)} – ${DP.b != null ? fd(DP.b) : '…'}` : ''}</span></div>`;
  $('#dp').innerHTML = html;
}
function pickDay(d) {
  if (DP.a == null || DP.b != null) { DP.a = d; DP.b = null; renderDP(); return; }
  if (d < DP.a) { DP.a = d; renderDP(); return; }
  DP.b = d; S.from = DP.a; S.to = DP.b; closeDP(); render();
}

function filterLines() {
  const [a, b] = range();
  return [[t('title') + ' — ' + t('sim')], [t('f.period'), `${fd(a)} – ${fd(b)}`], [t('rules.ww'), t('ww.' + S.ww)],
    ...[[t('f.cust'), S.cust && CUST[S.cust].name], [t('f.scope'), S.scope && t('sc.' + S.scope)], [t('f.type'), S.btype && t('ty.' + S.btype)], [t('f.level'), S.lv && t('lv.' + S.lv)], [t('f.branch'), S.branch && BR[S.branch].name]].filter(x => x[1]), []];
}
function sheet(aoa) { const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = [{ wch: 36 }, ...Array(12).fill({ wch: 14 })]; return ws; }
function detailSheet(rows) { const ws = XLSX.utils.json_to_sheet(rows.map(rowOut), { cellDates: true, dateNF: 'dd/mm/yyyy' }); ws['!cols'] = Array(18).fill({ wch: 16 }); return ws; }
function breakdownAoa(key) {
  const out = [[key === 'br' ? t('rank.br') : t('f.cust'), nl('balik'), nl('belum'), t('r.share'), ...SEV.map(s => L(s.label)), t('p.past'), nl('sudah'), t('r.rr'), t('p.ot')]];
  const tot = core(F).belum;
  [...new Set(F.map(r => r[key]))].map(id => ({ id, c: core(F.filter(r => r[key] === id)) })).sort((a, b) => b.c.belum - a.c.belum).forEach(({ id, c }) => {
    const s = sevCounts(c.belumRows);
    out.push([nameOf(key, id), c.balik, c.belum, r1(pct(c.belum, tot)), s.hitam, s.oranye, s.merah, s.ungu, c.overD, c.sudah, r1(pct(c.sudah, c.balik)), r1(pct(c.ontime, c.sudah))]);
  });
  return out;
}
async function saveWorkbook(wb, filename) {
  const data = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  if (!window.claude) { XLSX.writeFile(wb, filename); return; }
  const dl = await window.claude.use('downloads');
  if (!dl) { toast(t('t.na')); return; }
  try { await dl.save({ filename, data: new Uint8Array(data) }); toast(t('t.saved')); }
  catch (e) { toast(e && e.code === 'declined' ? t('t.cancel') : e && e.code === 'rate_limited' ? t('t.wait') : t('t.na')); }
}
function exportAll() {
  if (typeof XLSX === 'undefined') return toast(t('t.lib'));
  const wb = XLSX.utils.book_new(), c = core(F), sc = sevCounts(c.belumRows);
  const tree = NODES.map(n => { const rows = F.filter(n.t), pr = n.p ? F.filter(NODE[n.p].t).length : null, I = rows.filter(r => r.scope === 'INTRACITY').length;
    return ['  '.repeat(n.d) + L(n.label), L(n.short), rows.length, pr == null ? '' : r1(pct(rows.length, pr)), I, rows.length - I]; });
  XLSX.utils.book_append_sheet(wb, sheet([...filterLines(),
    [t('k1'), c.balik, r1(pct(c.balik, c.all))], [t('k2'), c.sudah, r1(pct(c.sudah, c.balik))], [t('k3'), c.belum, r1(pct(c.belum, c.balik))],
    [t('k4'), c.overD, r1(pct(c.overD, c.dlv))], [t('k5'), c.ontime, r1(pct(c.ontime, c.sudah))], [t('p.avg'), Math.round(c.avgLead || 0)], [],
    [t('sev.title'), t('c.count'), '%'], ...SEV.map(s => [`${L(s.label)} – ${L(s.short)} (${sevRanges(s)})`, sc[s.k], r1(pct(sc[s.k], c.belum))]), [],
    [t('tree.title'), '', t('c.count'), t('c.parent'), t('sc.INTRACITY'), t('sc.DOMESTIK')], ...tree]), 'Summary');
  const aoa = [[t('c.status'), ...BUCKETS.map(b => `${b.label} ${U()}`), t('total')]];
  ['ND', 'MDP', 'PODC', 'REDOC', 'UPLOAD', 'belum', 'STPOD', 'PODP', 'ARSIP', 'sudah'].forEach(id => { const rows = F.filter(NODE[id].t); aoa.push([nl(id), ...BUCKETS.map(b => rows.filter(r => r.bk === b.i).length), rows.length]); });
  XLSX.utils.book_append_sheet(wb, sheet(aoa), 'Aging');
  XLSX.utils.book_append_sheet(wb, sheet(breakdownAoa('br')), 'Branch');
  XLSX.utils.book_append_sheet(wb, sheet(breakdownAoa('cust')), 'Customer');
  XLSX.utils.book_append_sheet(wb, detailSheet(F.filter(r => r.req).sort((a, b) => b.age - a.age)), 'AWB');
  saveWorkbook(wb, `pod-performance_${ymd(TODAY)}.xlsx`);
}
function exportModal() {
  if (typeof XLSX === 'undefined') return toast(t('t.lib'));
  const wb = XLSX.utils.book_new(), sp = M.sp, rows = pool(sp), node = NODE[sp.node];
  XLSX.utils.book_append_sheet(wb, sheet([...filterLines(), [pathOf(node.id).map(nl).join(' › ')], ...specLabel(sp).map(([, v]) => ['', v]), [t('m.count'), rows.length]]), 'Summary');
  XLSX.utils.book_append_sheet(wb, detailSheet(rows.slice().sort((a, b) => (b.age ?? -1) - (a.age ?? -1))), 'AWB');
  saveWorkbook(wb, `pod_${(sp.podp || sp.stpod || node.id).toLowerCase()}_${ymd(TODAY)}.xlsx`);
}

/* ================= hint & toast ================= */
const tip = $('#tip');
let pinned = null;
function showTip(el, x, y) { tip.textContent = el.dataset.tip; tip.hidden = false; const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x + 12)) + 'px'; tip.style.top = (y + 18 + h > window.innerHeight ? Math.max(8, y - h - 10) : y + 18) + 'px'; }
function hideTip() { tip.hidden = true; pinned = null; }
document.addEventListener('pointermove', e => { if (e.pointerType === 'touch' || pinned) return; const el = e.target.closest && e.target.closest('[data-tip]'); if (el && el.dataset.tip) showTip(el, e.clientX, e.clientY); else tip.hidden = true; });
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && el.dataset.tip) { const b = el.getBoundingClientRect(); showTip(el, b.left, b.bottom - 10); } else if (!pinned) tip.hidden = true; });
let toastT;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2600); }

/* ================= event ================= */
document.addEventListener('click', e => {
  const tg = e.target;
  const inf = tg.closest('.info');
  if (inf) { e.preventDefault(); e.stopPropagation(); const b = inf.getBoundingClientRect(); if (pinned === inf) hideTip(); else { showTip(inf, b.left, b.bottom - 10); pinned = inf; } return; }
  if (pinned) hideTip();
  // date picker
  if (!$('#dp').hidden && !tg.closest('#dp') && !tg.closest('#f-range')) closeDP();
  if (tg.closest('#f-range')) { $('#dp').hidden ? openDP() : closeDP(); return; }
  const dpd = tg.closest('[data-dpday]'); if (dpd) return pickDay(+dpd.dataset.dpday);
  const dpn = tg.closest('[data-dpnav]'); if (dpn) { DP.m += +dpn.dataset.dpnav; if (DP.m < 0) { DP.m = 11; DP.y--; } if (DP.m > 11) { DP.m = 0; DP.y++; } return renderDP(); }
  const dpq = tg.closest('[data-dpq]'); if (dpq) { const [a, b] = dpq.dataset.dpq.split(',').map(Number); S.from = a; S.to = b; closeDP(); return render(); }
  const pm = tg.closest('[data-pmode]'); if (pm) { S.pmode = pm.dataset.pmode; render(); if (S.pmode === 'range') openDP(); return; }
  const lg = tg.closest('[data-lang]'); if (lg) { LANG = lg.dataset.lang; remember(); applyStatic(); render(); return; }

  const inModal = tg.closest('#dialog');
  const open = tg.closest('[data-open]');
  if (inModal) {
    if (tg.closest('#dlg-close')) return closeModal();
    if (tg.closest('#m-back')) { M.awb = null; return renderModal(true); }
    if (tg.closest('#m-apply')) return applyToDashboard();
    const reset = sp => { M.sp = sp; M.awb = null; M.page = 0; M.q = ''; renderModal(true); };
    const aw = tg.closest('[data-awb]'); if (aw) { M.awb = aw.dataset.awb; return renderModal(true); }
    const doc = tg.closest('[data-mdoc]'); if (doc) return reset({ node: 'balik', ...JSON.parse(doc.dataset.mdoc) });
    const mj = tg.closest('[data-mjump]'); if (mj) return reset({ node: mj.dataset.mjump });
    const mjs = tg.closest('[data-mjumpsev]'); if (mjs) return reset({ node: 'belum', sev: mjs.dataset.mjumpsev });
    const mn = tg.closest('[data-mnode]'); if (mn) { M.sp = { ...M.sp, node: mn.dataset.mnode }; M.page = 0; return renderModal(); }
    const mu = tg.closest('[data-munset]'); if (mu) { const sp = { ...M.sp }; delete sp[mu.dataset.munset]; M.sp = sp; M.page = 0; return renderModal(); }
    const ms = tg.closest('[data-msev]'); if (ms) { const sp = { ...M.sp }; delete sp.bk; if (sp.sev === ms.dataset.msev) delete sp.sev; else sp.sev = ms.dataset.msev; M.sp = sp; M.page = 0; return renderModal(); }
    if (open) { const o = JSON.parse(open.dataset.open); if (M.awb) return reset(o); const sp = { ...M.sp }; delete sp.bk; sp.sev = o.sev; M.sp = sp; M.page = 0; return renderModal(); }
    const mr = tg.closest('[data-mrefine]'); if (mr) { M.sp = { ...M.sp, ...JSON.parse(mr.dataset.mrefine) }; M.page = 0; return renderModal(); }
    const so = tg.closest('[data-msort]'); if (so) { const k = so.dataset.msort; M.dir = M.sort === k ? -M.dir : (k === 'age' ? -1 : 1); M.sort = k; return renderModal(); }
    const pg = tg.closest('[data-mpage]'); if (pg) { M.page += +pg.dataset.mpage; return renderModal(); }
    if (tg.closest('#m-export')) return exportModal();
    return;
  }
  if (open) return openModal(JSON.parse(open.dataset.open));
  if (tg === $('#modal')) return closeModal();
  const f = tg.closest('[data-filter]');
  if (f) {
    const k = f.dataset.filter;
    if (k === 'branch') { S.branch = f.dataset.val; S.btype = ''; S.lv = ''; } else S[k] = f.dataset.val;
    S.rankAll = false; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
    return toast(t('t.filtered', { x: nameOf(k === 'branch' ? 'br' : k, f.dataset.val) }));
  }
  const c = tg.closest('[data-clear]'); if (c) { if (c.dataset.clear === '*') ['cust', 'scope', 'btype', 'lv', 'branch'].forEach(k => { S[k] = ''; }); else S[c.dataset.clear] = ''; return render(); }
  const ww = tg.closest('[data-ww]'); if (ww) { S.ww = ww.dataset.ww; remember(); buildCalendar(S.ww); computeAges(); return render(); }
  const am = tg.closest('[data-am]'); if (am) { S.am = am.dataset.am; remember(); return renderAging(); }
  const rk = tg.closest('[data-rank]'); if (rk) { S.rank = rk.dataset.rank; S.rankAll = false; remember(); return renderRank(); }
  if (tg.closest('#rank-more')) { S.rankAll = !S.rankAll; return renderRank(); }
  if (tg.closest('#export-all')) return exportAll();
});
document.addEventListener('input', e => { if (e.target.id === 'm-q') { M.q = e.target.value; M.page = 0; const pos = e.target.selectionStart; renderModal(); const q = $('#m-q'); q.focus(); q.setSelectionRange(pos, pos); } });
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'f-period') { S.period = +e.target.value; return render(); }
  const k = { 'f-cust': 'cust', 'f-scope': 'scope', 'f-btype': 'btype', 'f-lv': 'lv', 'f-branch': 'branch' }[id];
  if (k) { S[k] = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('info')) { e.target.click(); return; }
  if (e.key === 'Escape' && !$('#dp').hidden) { closeDP(); $('#f-range').focus(); return; }
  if ($('#modal').hidden) return;
  if (e.key === 'Escape') { if (M.awb) { M.awb = null; return renderModal(true); } return closeModal(); }
  if (e.key === 'Tab') { const fs = [...$('#dialog').querySelectorAll('button:not([disabled]),input,.info')]; if (!fs.length) return;
    if (e.shiftKey && document.activeElement === fs[0]) { e.preventDefault(); fs[fs.length - 1].focus(); } else if (!e.shiftKey && document.activeElement === fs[fs.length - 1]) { e.preventDefault(); fs[0].focus(); } }
});

/* ================= init ================= */
buildCalendar(S.ww); computeAges(); applyStatic(); render();
if (window.claude) window.claude.use('downloads').then(d => { if (!d) { const b = $('#export-all'); b.disabled = true; b.dataset.tip = t('t.na'); } });
})();
</script>
